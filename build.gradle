plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.0.0'
    id 'checkstyle'
    id 'org.owasp.dependencycheck' version '12.2.0'
}

group = 'com.alleato'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '25'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // AWS SDK (for real implementations)
    implementation platform('software.amazon.awssdk:bom:2.25.16')
    implementation 'software.amazon.awssdk:sns'
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:s3'

    runtimeOnly 'org.postgresql:postgresql'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        googleJavaFormat('1.28.0')
        targetExclude 'build/**'
    }
}

checkstyle {
    toolVersion = '10.21.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

dependencyCheck {
    failBuildOnCVSS = 7.0f
    formats = ['HTML', 'JSON']
    suppressionFile = 'config/owasp/suppressions.xml'
}

tasks.register('installGitHooks') {
    doLast {
        def hooksDir = file('.git/hooks')
        def preCommit = new File(hooksDir, 'pre-commit')
        preCommit.text = '''\
#!/bin/sh
echo "Running pre-commit checks..."
./gradlew spotlessCheck checkstyleMain checkstyleTest --daemon --no-build-cache -q
'''.stripIndent()
        preCommit.setExecutable(true)
        println 'Git pre-commit hook installed.'
    }
}

tasks.named('classes').configure {
    dependsOn 'installGitHooks'
}
